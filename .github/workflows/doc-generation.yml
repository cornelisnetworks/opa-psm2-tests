# GitHub Action: Hypatia Documentation Generation
#
# Copy this workflow to any repo that should get auto-generated docs.
# Requires: HYPATIA_API_URL secret (optional — defaults to https://hypatia.cn-agents.com)
#
# Flow:
#   PR opened/updated → Hypatia generates docs → commits to PR branch → posts summary comment
#   Approval gate is the PR review itself — reviewers see the generated docs in the diff.

name: Generate Documentation

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: doc-gen-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-docs:
    if: >-
      github.actor != 'github-actions[bot]'
      && github.actor != 'scm-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Call Hypatia doc review
        id: hypatia
        run: |
          HYPATIA_URL="${{ secrets.HYPATIA_API_URL }}"
          if [ -z "$HYPATIA_URL" ]; then
            HYPATIA_URL="https://hypatia.cn-agents.com"
          fi

          RESPONSE=$(curl -sf -X POST \
            "${HYPATIA_URL}/v1/docs/pr-review" \
            -H "Content-Type: application/json" \
            -d '{
              "repo": "${{ github.repository }}",
              "pr_number": ${{ github.event.pull_request.number }},
              "target_dir": "docs",
              "dry_run": false
            }' \
            --max-time 600 \
            --retry 1 \
            --retry-delay 10 \
            2>/dev/null) || {
            echo "::warning::Hypatia API call failed — skipping doc generation"
            echo "api_ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          echo "$RESPONSE" > /tmp/hypatia_response.json

          OK=$(echo "$RESPONSE" | jq -r '.ok // false')
          DOC_COUNT=$(echo "$RESPONSE" | jq -r '.data.generated_docs | length // 0')
          COMMITTED=$(echo "$RESPONSE" | jq -r '.data.files_committed // false')
          COMMIT_SHA=$(echo "$RESPONSE" | jq -r '.data.commit_sha // empty')
          IMPACT=$(echo "$RESPONSE" | jq -r '.data.impact_summary // "no impact"')

          echo "::notice::Hypatia: $IMPACT"
          echo "api_ok=$OK" >> "$GITHUB_OUTPUT"
          echo "doc_count=$DOC_COUNT" >> "$GITHUB_OUTPUT"
          echo "committed=$COMMITTED" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

      - name: Post summary comment
        if: steps.hypatia.outputs.api_ok == 'true'
        uses: actions/github-script@v7
        env:
          DOC_COUNT: ${{ steps.hypatia.outputs.doc_count }}
          COMMITTED: ${{ steps.hypatia.outputs.committed }}
          COMMIT_SHA: ${{ steps.hypatia.outputs.commit_sha }}
        with:
          script: |
            const fs = require('fs');
            const response = JSON.parse(fs.readFileSync('/tmp/hypatia_response.json', 'utf8'));
            const data = response.data;
            const docCount = parseInt(process.env.DOC_COUNT, 10);
            const committed = process.env.COMMITTED === 'true';
            const commitSha = process.env.COMMIT_SHA;

            let body;

            if (docCount === 0) {
              body = '**Hypatia**: No documentation impact detected for this PR.';
            } else {
              const impactRows = (data.impact_details || []).map(d => {
                const change = `${d.status} (+${d.additions}/-${d.deletions})`;
                return `| ${d.source} | ${change} | ${d.doc_type} | \`${d.target}\` |`;
              }).join('\n');

              const impactTable = [
                '| Source | Change | Type | Target |',
                '|--------|--------|------|--------|',
                impactRows
              ].join('\n');

              const docList = (data.generated_docs || []).map(doc => {
                const chars = (doc.content_length || 0).toLocaleString();
                return `- \`${doc.path}\` (${chars} chars) — record \`${doc.record_id}\``;
              }).join('\n');

              const shaNote = commitSha ? ` [\`${commitSha.substring(0, 7)}\`](../commit/${commitSha})` : '';
              const statusLine = committed
                ? `Committed ${docCount} doc(s) to this branch${shaNote}.`
                : `Generated ${docCount} doc(s) (not committed).`;

              body = [
                '## Documentation Generated',
                '',
                statusLine,
                '',
                '### Impact',
                impactTable,
                '',
                '### Files',
                docList,
                '',
                '---',
                '*Review the generated docs in this PR diff. Hypatia records are stored for traceability.*'
              ].join('\n');
            }

            const MARKER = 'Documentation Generated';
            const NO_IMPACT = 'No documentation impact';
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              (c.body.includes(MARKER) || c.body.includes(NO_IMPACT) || c.body.includes('Documentation analysis'))
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

      - name: Post API-unreachable warning
        if: steps.hypatia.outputs.api_ok == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const body = '**Hypatia**: Documentation generation unavailable — API did not respond.';
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number, owner: context.repo.owner,
              repo: context.repo.repo, per_page: 100
            });
            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              (c.body.includes('Documentation Generated') || c.body.includes('documentation impact') || c.body.includes('Documentation generation'))
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body: body
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number, owner: context.repo.owner,
                repo: context.repo.repo, body: body
              });
            }
